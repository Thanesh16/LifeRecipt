    <script>
      if ('serviceWorker' in navigator && process?.env?.NODE_ENV !== 'development') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[LifeReceipt PWA] Service worker registered:', reg.scope);
            })
            .catch((err) => {
              console.warn('[LifeReceipt PWA] Service worker registration failed:', err);
            });
        });
      }
    </script>
